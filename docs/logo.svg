<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="gah - Git Add Hunks logo">
  <title>gah — Git Add Hunks</title>

  <!-- terminal tile -->
  <rect width="512" height="512" rx="96" fill="#0d1117"/>
  <rect x="8" y="8" width="496" height="496" rx="88" fill="none" stroke="#21262d" stroke-width="2"/>

  <!-- diff hunk block -->
  <g>
    <!-- removed line (red) -->
    <rect x="112" y="150" width="200" height="40" rx="8" fill="#3d1c1c"/>
    <rect x="112" y="150" width="8"  height="40" rx="4" fill="#f85149"/>
    <rect x="136" y="164" width="120" height="12" rx="6" fill="#f85149" opacity="0.85"/>

    <!-- removed line (red), shorter -->
    <rect x="112" y="200" width="160" height="40" rx="8" fill="#3d1c1c"/>
    <rect x="112" y="200" width="8"  height="40" rx="4" fill="#f85149"/>
    <rect x="136" y="214" width="84"  height="12" rx="6" fill="#f85149" opacity="0.85"/>

    <!-- added line (green) -->
    <rect x="112" y="272" width="200" height="40" rx="8" fill="#13311f"/>
    <rect x="112" y="272" width="8"  height="40" rx="4" fill="#3fb950"/>
    <rect x="136" y="286" width="140" height="12" rx="6" fill="#3fb950" opacity="0.9"/>

    <!-- added line (green), shorter -->
    <rect x="112" y="322" width="170" height="40" rx="8" fill="#13311f"/>
    <rect x="112" y="322" width="8"  height="40" rx="4" fill="#3fb950"/>
    <rect x="136" y="336" width="100" height="12" rx="6" fill="#3fb950" opacity="0.9"/>
  </g>

  <!-- dashed cut line between red and green hunks -->
  <line x1="84" y1="256" x2="340" y2="256"
        stroke="#8b949e" stroke-width="4" stroke-linecap="round"
        stroke-dasharray="2 18"/>

  <!-- scissors riding the cut line -->
  <g transform="translate(348 256)" stroke="#e6edf3" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- blades -->
    <line x1="0" y1="0" x2="44" y2="-26"/>
    <line x1="0" y1="0" x2="44" y2="26"/>
    <!-- finger rings -->
    <circle cx="-16" cy="-22" r="16"/>
    <circle cx="-16" cy="22"  r="16"/>
    <!-- pivot -->
    <circle cx="0" cy="0" r="5" fill="#e6edf3" stroke="none"/>
  </g>
</svg>
